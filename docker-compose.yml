services:
  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yukkcat/chatgpt2api:latest}
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "${CHATGPT2API_PORT:-3000}:80"
    volumes:
      - chatgpt2api-runtime:/app
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      CHATGPT2API_THREAD_TOKENS: ${CHATGPT2API_THREAD_TOKENS:-120}
      CHATGPT2API_IMAGE_THREAD_TOKENS: ${CHATGPT2API_IMAGE_THREAD_TOKENS:-32}
      CHATGPT2API_IMAGE_REQUEST_LIMIT: ${CHATGPT2API_IMAGE_REQUEST_LIMIT:-128}
      CHATGPT2API_EDITABLE_FILE_TASK_LIMIT: ${CHATGPT2API_EDITABLE_FILE_TASK_LIMIT:-4}
      CHATGPT2API_EDITABLE_FILE_RETENTION_HOURS: ${CHATGPT2API_EDITABLE_FILE_RETENTION_HOURS:-168}
      CHATGPT2API_AUTH_FAILURE_LIMIT: ${CHATGPT2API_AUTH_FAILURE_LIMIT:-10}
      CHATGPT2API_AUTH_FAILURE_WINDOW_SECONDS: ${CHATGPT2API_AUTH_FAILURE_WINDOW_SECONDS:-300}
      CHATGPT2API_AUTH_LOCKOUT_SECONDS: ${CHATGPT2API_AUTH_LOCKOUT_SECONDS:-900}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      TZ: ${TZ:-Asia/Shanghai}

volumes:
  chatgpt2api-runtime:
